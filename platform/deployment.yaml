apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-skill
  labels:
    app.kubernetes.io/name: slack-skill
    app.kubernetes.io/instance: slack-skill
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slack-skill
      app.kubernetes.io/instance: slack-skill
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slack-skill
        app.kubernetes.io/instance: slack-skill
    spec:
      serviceAccountName: slack-skill
      containers:
        - name: slack-skill
          image: europe-docker.pkg.dev/aure-mvp/docker/slack-skill:latest
          volumeMounts:
            - name: config
              mountPath: /app/.claude/config
              readOnly: true
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: config
          secret:
            secretName: slack-skill
            items:
              - key: slack-skill.yaml
                path: slack-skill.yaml
